name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (discount rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdd-discount/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  api:
    name: API tests (Newman)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start BookNook
        working-directory: sample-app
        run: |
          npm ci
          node server.js &
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
      - name: Install Newman
        working-directory: api-tests
        run: npm ci
      - name: Run collection (report only)
        working-directory: api-tests
        continue-on-error: true
        run: npx newman run booknook.postman_collection.json -e booknook-local.postman_environment.json -r cli,json --reporter-json-export results/api.json
      - name: Pass rate summary
        if: always()
        working-directory: api-tests
        run: |
          total=$(jq '.run.stats.assertions.total' results/api.json)
          failed=$(jq '.run.stats.assertions.failed' results/api.json)
          echo "### API tests: $((total - failed)) of $total assertions passed ($(( (total - failed) * 100 / total ))%)" >> "$GITHUB_STEP_SUMMARY"
          echo "Failures are known defects tracked in GitHub Issues." >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI tests (Cypress)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start BookNook
        working-directory: sample-app
        run: |
          npm ci
          node server.js &
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
      - name: Install Cypress
        working-directory: ui-tests
        run: |
          npm ci
          npx cypress install
      - name: Smoke tests (gate)
        working-directory: ui-tests
        run: npx cypress run --browser chrome --spec "cypress/e2e/login.cy.js,cypress/e2e/catalog.cy.js"
      - name: Accessibility and known defects (report only)
        working-directory: ui-tests
        continue-on-error: true
        run: npx cypress run --browser chrome --spec "cypress/e2e/accessibility.cy.js,cypress/e2e/discount.cy.js"
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: ui-tests/cypress/snapshots/actual
          if-no-files-found: ignore
